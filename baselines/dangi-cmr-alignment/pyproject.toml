[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dangi-stage-a"
version = "0.1.0"
description = "Dangi et al. (2018) LV centre regression and slice alignment baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.14", "torch>=2.5", "nibabel>=5.3"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8", "ipywidgets>=8", "nbclient>=0.10"]

[tool.setuptools.packages.find]
include = ["dangi*"]
