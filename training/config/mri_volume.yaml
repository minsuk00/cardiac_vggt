# PYTHONUNBUFFERED=1 PYTHONPATH=training:. torchrun --nproc_per_node=1 --master_port=29507 training/launch.py --config mri_volume
#
# Unsupervised slice-to-volume: drops GT-DVF supervision, adds splat+resample intensity loss.
#
# PRIMARY PIPELINE = TARGET-PHASE REFERENCE-SLICE CONDITIONING (docs/24, docs/25). The query
# is no longer a content-free target_t INDEX (which regressed every patient's EF to the cohort
# mean, ~48%); instead slot 0 is a real target-phase reference slice at the mid-ventricular
# plane, marked via VGGT's native camera_token anchor. The model reads the target phase from
# slot-0's image content. This fixes BOTH the flat-EF amplitude regression and the
# target_t=k/12 phase-timing ambiguity. Requires the aggregator finetune (aggft) so the
# camera_token / z_embedder can specialize. `target_t_indices` is still emitted by the dataset
# but is INERT (the legacy target_t conditioning was removed → the model ignores it).

defaults:
  - mri_finetune
  - _self_

exp_name: "${rev_ts:}_mri_volume_${mri_data_mode}_${mri_mode}_${dataset_name}"
config_name: "mri_volume"

# ── Reference-slice conditioning (overrides mri_finetune defaults) ───────────────────────────
use_reference_token: true            # MODEL: add the native camera_token anchor on slot 0
reference_slot: true                 # DATASET: slot 0 = (t_target, mid-ventricular z)
use_z_pose_embedding: true           # keep per-slice depth

# ── EF-aware validation (overrides parent default off) ───────────────────────────────────────
ef_val_sweep: true                   # val = targeted 30×{ED,ES} sweep (honest per-phase + EF volumes)
# ef_eval_enable inherits parent default (true) — set false to keep the sweep but skip nnU-Net EF.

logging:
  log_visual_frequency:
    train: 1000  # once per epoch (matches limit_train_batches)
    val: 200     # once per val epoch
  # Cardiac filmstrip/GIF + ED/ES panels every 3 val epochs (was 1, then 5). At 1 the filmstrip does
  # 12 subj-0 model forwards per epoch (~4 h over 200 epochs); 3 gives finer cadence for shorter (~90 ep) runs.
  filmstrip_every_n_val_epochs: 3
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_volume
        - loss_pos_tv
        - loss_diffusion
        - loss_gather
        # Full-volume metrics (averaged over all D·H·W = 786K voxels).
        # Matches what the L1 loss is optimizing.
        - metric_mae_3d_full
        - metric_mse_3d_full
        - metric_psnr_3d_full
        - metric_ssim_3d_full
        # Bbox-cropped metrics (only voxels inside the subject's geometric
        # native-FOV region — derived from a content mask propagated through
        # the canonical resample/pad/crop transforms, not from intensity).
        # For small-FOV subjects this excludes the padded zeros that inflate
        # full-volume PSNR. For full-FOV subjects bbox == full.
        - metric_mae_3d_bbox
        - metric_mse_3d_bbox
        - metric_psnr_3d_bbox
        - metric_gt_coverage_frac
        - metric_mean_disp_norm
        - metric_coverage_frac
        - metric_coverage_mean
    val:
      keys_to_log:
        - loss_objective
        - loss_volume
        - loss_pos_tv
        - loss_diffusion
        - loss_gather
        - metric_mae_3d_full
        - metric_mse_3d_full
        - metric_psnr_3d_full
        - metric_ssim_3d_full
        - metric_mae_3d_bbox
        - metric_mse_3d_bbox
        - metric_psnr_3d_bbox
        - metric_gt_coverage_frac
        - metric_mean_disp_norm
        - metric_coverage_frac
        - metric_coverage_mean
        # GT-referenced ship-decision + breathing metrics (val-only; docs/38). These are
        # produced by compute_volume_intensity_loss ONLY in val (requires_grad gate), so
        # listing them here (not under train:) is what makes them appear in wandb.
        - metric_recov_frac_heart
        - metric_mse_heart_identity
        - metric_mse_heart_model
        - metric_mse_heart_oracle
        - metric_hole_frac_heart
        - metric_psnr_3d_static
        # Anatomy whole-heart-ROI PSNR (nnU-Net seg union+dilation; val-only). Shared
        # ROI with the SVR baselines; complements the intensity-derived motion PSNR.
        - metric_psnr_3d_heartseg
        - metric_mae_3d_heartseg
        - metric_heartseg_frac
        - metric_resp_slope_dz
        - metric_resp_corr_dz
        - metric_resp_epe_dz_mm
        - metric_resp_frac_deep_ignored

checkpoint:
  save_freq: 50  # 3 numbered archives over 200 epochs (epochs 50/100/150) + checkpoint_last each epoch

# ── Aggregator finetune (aggft) — required for reference-slice conditioning ──────────────────
# Reference conditioning needs the camera_token (the slot-0 anchor) + z_embedder to specialize,
# so we train the DINOv2 attention blocks + embedders + camera_token and freeze ONLY patch_embed
# (NOT the head-only "*aggregator*" wildcard the parent mri_finetune uses). ~2.8× slower,
# ~27 GB/A40. Mirrors mri_volume_bspline/diffusion.
# ── Train-step speed (docs/40) ────────────────────────────────────────────────────────────────
# Measured 1.28x on the full train step (L40S 2255 -> 1761 ms/step; A40 3940 -> 3092 ms) and
# -1.1 GB VRAM, for ~15-22 s of one-time compile. NOT bit-identical to eager: compile matches
# to ~4e-6 (bf16 reassociation) and fused AdamW reorders its update, so enabling these starts a
# fresh numeric series. Set both False to reproduce a pre-2026-07-27 run exactly.
cuda:
  compile_attention_blocks: True

optim:
  frozen_module_names: ["*patch_embed*"]
  optimizer:
    # Fused AdamW: one multi-tensor CUDA kernel for the 941M-param update (docs/40 E8/E9).
    fused: True

loss:
  volume:
    weight: 1.0
    # grid_shape is no longer a config param — compute_volume_intensity_loss derives it
    # from batch["gt_target_volume"].shape[1:] (D varies per subject, native-z, docs/58).
    tv_weight: 0.1
    # L2 diffusion (Tikhonov) smoothness ‖∇u‖² on the DVF (VoxelMorph-style). 0.0 ⇒ no-op.
    # DVF is in normalized [-1,1] coords ⇒ gradients are tiny, so a nonzero weight is O(10–1000).
    diffusion_weight: 0.0
    # Coverage-free gather-placement AUXILIARY (docs/37, docs/38): |sample_volume(V_gt, p) − input_I|,
    # a "pull" term that restores the sharp through-plane placement gradient the splat ÷coverage
    # flattens. Same [0,1] intensity scale as the primary L1 ⇒ weight is a direct ratio; start
    # ~0.1–0.2, sweep toward ~0.5 (docs/38). 0.0 ⇒ no-op (bit-identical). Whole volume, no mask.
    gather_weight: 0.0

# ── GPU augmentation (batchaug) ─────────────────────────────────────────────
# ON by default (2026-07-31). Set `enable: false` to opt out. Augmentation is applied to the
# (B, T=12, D, H=256, W=256) canonical phases tensor in the trainer between
# (`D` = this subject's own native slice count under native-z, NOT a fixed 12)
# `copy_data_to_device` and forward — one affine per subject, shared across
# all 12 T-phases so cardiac motion stays consistent. After aug:
#   - `gt_target_volume` is re-derived as `phases_aug[b, t_target[b]]`
#   - input slices are re-extracted at the original (t, z) pairs
#   - `anatomy_bbox` is recomputed from the augmented content mask
# Val never augments regardless of this flag.
#
# `tier` — all three ARE implemented (`training/data/gpu_aug.py`). All are IN-PLANE ONLY:
# no through-plane rotation and no elastic, because z is coarse and anisotropic relative
# to the 1.4 mm in-plane grid (native-z: each subject keeps its own 5-12 mm pitch, docs/58).
# Every tier applies a W-axis flip at p=0.5 (re-enabled 2026-07-31, docs/58 §10c) and has
# Gaussian noise commented out (models i.i.d. noise; real degradation is structured).
#   "conservative" — flip p=.5; affine p=.5 (rotate ±45° in-plane, translate ±6 px,
#                    scale ±5%); gamma p=.4 (0.8-1.3); bias field p=.4 (±0.10).
#   "moderate"     — flip p=.5; affine p=.6 (rotate ±180° FULL-CIRCLE, translate ±16 px,
#                    scale ±5%); gamma p=.6 (0.7-1.5); bias field p=.5 (±0.5).
#   "aggressive"   — flip p=.5; affine p=.9 (rotate ±180°, translate ±20 px, scale ±8%);
#                    gamma p=.75 (0.6-1.7); bias field p=.7 (±0.6).
#
# `respiratory`: INDEPENDENT breathing-motion sim (separate toggle from affine).
# A per-input-slice deform-then-reslice SI+AP shift (Lujan waveform), applied
# AFTER affine and overwriting ONLY the input slices — target/scanner_coords stay
# at the end-expiration reference, so the model learns to CORRECT breathing (blind
# to r). Unlike affine, it applies in BOTH train (iid per epoch, private RNG) AND
# val (deterministic per seq_index) — so val measures the real corrupted->clean
# task. Tilt (`tilt_min_deg`..`tilt_max_deg`) randomizes the SI direction (SAX stacks
# are tilted ~20-45° off true SI) with ONE direction per SUBJECT (fixed acquisition
# geometry), and amplitude SCALE is per-subject (one lung capacity) — only breath
# PHASE varies per z-plane. 0 tilt → pure SI+AP.
data:
  augmentation:
    enable: true                # ON by default as of 2026-07-31 (user decision). Includes the
                                # re-enabled W-axis flip (docs/58 §10c): the training objective is
                                # exactly mirror-equivariant, and 29% of the pooled CMRx cohort is
                                # mirrored on disk, so chirality-robustness is wanted, not avoided.
                                # (docs/05's "aggressive aug hurts in-dist" was measured on the
                                # AGGRESSIVE tier at 294 subjects; the default here is conservative
                                # and the pooled cohort is 1343.)
    tier: "conservative"
    respiratory:
      enable: true              # breathing sim ON for all reference runs (the proven "resp, z-only" recipe; docs/05). Inherited by mri_volume_diffusion/bspline.
      # SI breath-depth mean/jitter from Burger & Meintjes, "Elliptical Subject-Specific
      # Model of Respiratory Motion for Cardiac MRI," Magn. Reson. Med. 70:722-731 (2013).
      amplitude_mm: 18.8        # mean SI breath depth (mm)
      amplitude_jitter: 7.35    # +/- jitter → ~11.45-26.15mm (tidal → deep)
      cos2n: 3                  # Lujan sin^{2n} exhale-dwell knob
      ap_ratio: 0.35            # AP displacement = ap_ratio * SI
      ap_axis: "H"              # in-plane axis carrying AP ("H" or "W")
      per_slot: true            # LEGACY (non-burst path only): breath DEPTH per slice vs per subject
      group_by_burst: true      # REALISTIC: all frames of one z-plane share ONE breath PHASE,
                                # independent across planes — a fast per-slice burst sits at ~one
                                # respiratory position, different slices = different breaths. false →
                                # legacy per-slot-iid (lets the splat average breathing away). docs/01.
      tilt_min_deg: 0.0         # tilt θ ~ U(tilt_min,tilt_max) deg, ONE direction per SUBJECT (not
      tilt_max_deg: 45.0        # per plane); 0-45 keeps near-axial + fixes the old U(0,30) undershoot
      amplitude_breath_jitter: 0.0  # per-subject amplitude scale; >0 adds fractional per-breath tidal jitter
