# PARENT CONFIG — do NOT run standalone. This is the shared base that mri_volume.yaml
# (the active config) inherits. Its legacy supervised-DVF / target_t `loss:` block was
# removed (docs/48), so composing `--config mri_finetune` alone resolves to no `loss.volume`
# → MultitaskLoss(volume=None) → objective=0 → a silent zero-loss run. Always run
# `--config mri_volume` (or mri_volume_bspline / mri_volume_diffusion) instead.

defaults:
  - default
  - _self_

# Global overrides
split: "train"
mode: "train"

# --- Main Controls ---
# Pooled multi-dataset cohort (docs/58 §13): 1337 subjects across CMRxRecon2023/2024/2025 +
# ACDC + M&Ms-1, split 935/133/269 (69.9:9.9:20.1). 6 source-shipped duplicate subjects are
# excluded (docs/59 F3), which is why this is 1337 and not 1343.  data_root is the shared parent, and split-file
# lines are relative paths under it (e.g. `CMRxRecon2024/Cine_combined/CMRx24_Train_P001`) —
# MRIDataset._find_subjects joins them directly, so no loader change was needed.
# The old CMRxRecon2024-only pair was:
#   data_root: ".../scratch/data/CMRxRecon2024/Cine_combined"
#   split_file: "training/splits/random_8_1_1.txt"   (deprecated)
data_root: "/home/minsukc/vggt/scratch/data"
split_file: "training/splits/pooled.txt"
mri_mode: "axial"
mri_data_mode: "dynamic" # "static" or "dynamic"

train_on_residual_dvf: true
use_z_pose_embedding: true
# Reference-slice conditioning (docs/25): slot 0 = target-phase reference at the mid-ventricular
# plane, marked via the native camera_token anchor instead of a target_t index. Default off here
# (parent config keeps the legacy decoupled behavior); mri_volume.yaml turns it on and disables
# use_t/use_target_t. `reference_slot` is the DATASET half (slot-0 sampling); `use_reference_token`
# is the MODEL half (camera_token anchor). They must move together.
use_reference_token: false
reference_slot: false
# Continuous physical z (docs/28): when true, non-reference input slots are sampled at a
# CONTINUOUS z (nominal plane + jitter ∈ [-z_jitter, +z_jitter]) and extracted by interpolation,
# teaching z as a continuous physical coordinate (off-grid inference slices). Default false ⇒
# integer planes (numerically identical to the discrete-grid pipeline).
continuous_z: false
z_jitter: 0.5
# One-frame-per-slice (sparse-acquisition extreme): when true, S is forced per subject to the
# in-FOV plane count so every in-bbox z plane appears EXACTLY once (no multi-frame extras).
# Overrides the fixed img_nums/num_slices budget. Default true ⇒ this is the actual intended
# usage mode (research goal is the one-frame-per-slice extreme); set false for fixed-S multi-frame.
one_frame_per_slice: true
# 935 pooled train subjects = one exact pass per epoch (docs/59 F6). Keep this equal to the
# train-split size: a value above it re-draws a fixed, seed-invariant prefix of the (sorted,
# so ACDC-first) split every epoch, silently oversampling one source.
limit_train_batches: 935
# 133 pooled val subjects x {ED, ES} = 266 entries under ef_val_sweep — one full deterministic
# pass. Was 200, sized for the 100-val-subject plan; at 200 the last ~68 ES entries would
# never be evaluated.
limit_val_batches: 266
max_epochs: 200
val_epoch_freq: 1
# Target-phase control. null = uniform sampling per call (new pipeline, multi-phase).
# Set to an int (e.g., 0) to force every sample to use that phase as the target —
# 0 reproduces the original ED-only pipeline.
t_target_fixed: null
# Restrict the multi-phase target pool to a subset of phases (e.g. [0, 7]) instead
# of all T. null → all phases. Train picks uniformly from the list; val cycles it
# deterministically. Mutually exclusive with t_target_fixed (single-phase wins).
t_target_phases: null
# EF-aware validation. `ef_val_sweep` replaces the coupled val sampler with a targeted
# 30×{ED, ES} sweep (each subject reconstructed at its GT ED + ES phase from cardiac_phase.csv),
# so per-phase panels are honest AND we get the ED/ES volumes EF needs. `ef_eval_enable` (ON by
# default, but optional) additionally runs nnU-Net Task114 on those pred volumes every
# `ef_eval_every_n_val_epochs` and logs predicted-vs-GT EF slope/Spearman. Setting ef_eval_enable
# false keeps the cheap sweep but skips the heavy segmentation. Both no-op unless ef_val_sweep is on.
ef_val_sweep: false
# ED/ES table for the sweep. Must be set explicitly now that data_root is the shared parent:
# MRIDataset's fallback is `${data_root}/../../whs/cardiac_phase.csv`, which was only correct
# when data_root pointed two levels deeper (CMRxRecon2024/Cine_combined).
cardiac_phase_csv: "/home/minsukc/vggt/scratch/data/whs/cardiac_phase.csv"
# ---------------------

# Not `${basename:${data_root}}` anymore — that would resolve to the useless "data".
dataset_name: "pooled1337"
exp_name: "${rev_ts:}_mri_${mri_data_mode}_${mri_mode}_${dataset_name}"
num_workers: 4
accum_steps: 1

# Redirect Logging and Checkpoints to Scratch
logging:
  log_dir: "./scratch/logs/${exp_name}"
  log_freq: 5
  log_visuals: True
  log_visual_frequency:
    train: 100
    val: 40
  visuals_per_batch_to_log: 4
  video_logging_fps: 4
  # Multi-phase cardiac-cycle filmstrip (val-only, gated on t_target_fixed is None).
  # Logged every N val epochs (~72s: 12 model forwards on A40). Set to 1 to watch the
  # full-cycle V_gt vs V_canon reconstruction every epoch.
  filmstrip_every_n_val_epochs: 1
  # Predicted-EF metric (val-only; requires ef_val_sweep). ef_eval_enable ON by default but
  # OPTIONAL — false keeps the ED/ES sweep but skips the heavy nnU-Net segmentation. When on,
  # nnU-Net Task114 segs the ED/ES pred volumes every N val epochs → val_ef/{slope,spearman,mae_pct}.
  ef_eval_enable: true
  ef_eval_every_n_val_epochs: 5
  # Dump per-subject predicted + GT volumes to ${log_dir}/val_volumes/ each val epoch.
  # Overwrites in place (constant ~360 MB disk). Identity affine (canonical voxel space).
  save_val_volumes: true
  wandb_writer:
    _target_: train_utils.wandb_writer.WandbLogger
    project: "vggt-mri"
    name: ${exp_name}
    dir: ${logging.log_dir}/wandb
    tags:
      - ${oc.select:config_name,mri}
      - ${phase_mode:${t_target_fixed}}
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_conf_point
        - loss_reg_point
        - loss_grad_point
    val:
      keys_to_log:
        - loss_objective
        - loss_conf_point
        - loss_reg_point
        - loss_grad_point
  visuals_keys_to_log:
    train:
      modality: "image"
      keys_to_log:
        - images
        - world_points
        - pred_world_points
    val:
      modality: "image"
      keys_to_log:
        - images
        - world_points
        - pred_world_points

checkpoint:
  save_dir: "${logging.log_dir}/ckpts"
  save_freq: 200
  resume_checkpoint_path: "./scratch/base_weights/vggt1b_base.pt"
  strict: false

# Override data to use ONLY MRIDataset via ComposedDataset
data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    shuffle: True
    pin_memory: False
    common_config:
      fix_img_num: -1
      fix_aspect_ratio: 1.0
      training: True
      inside_random: True
      img_nums: [20, 20]  # fixed S=20 slot budget (multi-frame: full z-coverage + uniform-random extras)
      augs:
        aspects: [1.0, 1.0]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.MRIDataset
          data_root: ${data_root}
          split: ${split}
          split_file: ${split_file}
          mode: ${mri_data_mode}
          mri_mode: ${mri_mode}
          num_slices: 20
          target_size: ${img_size}
          t_target_fixed: ${t_target_fixed}
          t_target_phases: ${t_target_phases}
          reference_slot: ${reference_slot}
          continuous_z: ${continuous_z}
          one_frame_per_slice: ${one_frame_per_slice}
          z_jitter: ${z_jitter}
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    shuffle: False
    pin_memory: False
    common_config:
      fix_img_num: -1
      fix_aspect_ratio: 1.0
      training: False
      inside_random: False
      img_nums: [20, 20]  # fixed S=20 slot budget (multi-frame: full z-coverage + uniform-random extras)
      augs:
        aspects: [1.0, 1.0]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.MRIDataset
          data_root: ${data_root}
          split: "val"
          split_file: ${split_file}
          mode: ${mri_data_mode}
          mri_mode: ${mri_mode}
          num_slices: 20
          target_size: ${img_size}
          t_target_fixed: ${t_target_fixed}
          t_target_phases: ${t_target_phases}
          reference_slot: ${reference_slot}
          continuous_z: ${continuous_z}
          one_frame_per_slice: ${one_frame_per_slice}
          z_jitter: ${z_jitter}
          ef_val_sweep: ${ef_val_sweep}
          cardiac_phase_csv: ${cardiac_phase_csv}

# Enable Point Head, disable others
model:
  enable_point: true
  use_z_pose_embedding: ${use_z_pose_embedding}
  use_reference_token: ${use_reference_token}
  train_on_residual_dvf: ${train_on_residual_dvf}
  # Warp head: "dpt" (default per-pixel DPT) or "bspline" (coarse control grid + B-spline
  # upsample, smooth-by-construction). bspline_grid_size = control points per side.
  warp_head_type: "dpt"
  bspline_grid_size: 32

# Configure Optim — entire aggregator frozen (incl. z/t Fourier embedders); only point_head trains.
#
# ⚠️ STALE NAMES (docs/59 F20): `t_embedder` / `target_t_embedder` NO LONGER EXIST — the legacy
# target_t conditioning was removed (docs/25, reference-slice conditioning). Only `z_embedder`
# remains. The throughput argument below still holds for it; read `t_embedder` as historical.
# Also note mri_volume.yaml (the config you actually run) OVERRIDES this to aggft
# (`frozen_module_names: ["*patch_embed*"]`), so this whole rationale describes the
# legacy head-only regime, not the active one.
#
# Why z_embedder + t_embedder are ALSO frozen (despite living "in" the aggregator):
#   In an earlier iteration we enumerated the heavy aggregator subparts so the embedders
#   stayed trainable. A controlled A/B (see /tmp/ab_single.py history) measured the cost:
#     OLD wildcard `*aggregator*` (embedders frozen):     1.32 sec/step
#     NEW enumerated (embedders trainable):               3.25 sec/step  → 2.5× slower
#   The 28K-param embedders are tiny but trainable, which forces backward to traverse
#   ALL 48 frozen attention blocks via gradient checkpointing recomputation to reach
#   them. The compute cost is in the autograd graph traversal, not the params themselves.
#
# Since the 4-day baseline (which had embedders frozen at random init by accident) reached
# 31+ dB PSNR on ED-only, the trainable embedders aren't proven to help quality — but they
# would halve our usable epochs per 48h SLURM slot. Frozen wins on practical throughput.
#
# When to revisit: if you unfreeze the aggregator's attention blocks (e.g., for a
# fundamental retraining on free-breathing data or Option B continuous-phase support),
# the backward already traverses those blocks, so making embedders trainable becomes
# free. In that scenario, enumerate the subparts explicitly and let z/t embedders learn.
optim:
  frozen_module_names: ["*patch_embed*", "*camera_token*", "*aggregator*"]
  amp:
    enabled: true
    amp_dtype: bfloat16
  gradient_clip:
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["point"]
        max_norm: 1.0
        norm_type: 2
