# The 224-px no-reg recipe: default.yaml at 224 input, native splat, no diffusion regularizer.
# default.yaml carries the shared knobs (heart_weight=0.5, gather_weight=0.5, lr 5e-5, aggft
# freeze, 300 epochs); the ONLY deltas are below.
# Run: torchrun --nproc_per_node=1 -m training.launch --config default_224

defaults:
  - default
  - _self_

# 224 = 16² tokens: several × faster, about half the VRAM vs 518 (docs/72). Metrics are not
# comparable across img_size.
img_size: 224
max_epochs: 300

data:
  augmentation:
    tier: "aggressive"

loss:
  volume:
    splat_res: null
    diffusion_weight: 0.0
