# THE config — and THE PAPER RECIPE: this file resolves to exactly the paper model's run
# (ARM=diff1000 of sbatch/train_final_518.sh: 518 input, 518 training splat, diffusion 1000,
# 300 epochs). Complete and runnable on its own:
#
#   python -m training.launch --config default
#
# The paper's ablation arms are `ablation_*.yaml`; other experiment variants (`exp_*.yaml`,
# `default_224.yaml`) — all inherit this file, overriding only what they change.
#
# ── PIPELINE = TARGET-PHASE REFERENCE-SLICE CONDITIONING (docs/25) ───────────────────────
# Unsupervised slice-to-volume: no GT-DVF supervision, a splat+resample intensity loss.
# Slot 0 is a real target-phase reference slice at the mid-ventricular plane, marked via
# VGGT's native camera_token anchor, so the model reads the target phase from slot-0's image
# content. Requires the aggregator finetune (aggft) below so the camera_token / z_embedder
# can specialize.

defaults:
  - _self_

# ── Identity ──────────────────────────────────────────────────────────────────────────────
# `exp_name` keeps the "mri_volume" family name (it names log dirs / wandb runs and is the
# continuity link to the existing run series).
exp_name: "${rev_ts:}_mri_volume_${mri_data_mode}_${mri_mode}_${dataset_name}"

split: "train"
mode: "train"
# Model-input resolution: any multiple of patch_size. 518 = 37² tokens (original VGGT), 224 = 16²
# (several × faster, about half the VRAM). Changing it starts a fresh numeric series.
img_size: 518
backbone: "dinov2_vitl14_reg"
# Derived from the backbone (dinov2_* -> 14, dinov3_vitl16 -> 16) — not a free knob.
patch_size: ${backbone_ps:${backbone}}
seed_value: 42
num_workers: 4

# ── Cohort ────────────────────────────────────────────────────────────────────────────────
# Curated pooled cohort: 898 subjects across CMRxRecon2023/2024/2025 + ACDC + M&Ms-1, split
# 628/90/180 train/val/test (see training/splits/README.md). data_root is the shared parent,
# and split-file lines are relative paths under it
# (e.g. `CMRxRecon2024/Cine_combined/CMRx24_Train_P001`).
data_root: "/home/minsukc/vggt/scratch/data"
split_file: "training/splits/pooled_curated_v2.txt"
dataset_name: "curated898"
# NATIVE SAX z-slicing (not anatomical axial). Only decorates `seq_name`.
mri_mode: "axial"
mri_data_mode: "dynamic"   # "static" or "dynamic"

# ── Main controls ─────────────────────────────────────────────────────────────────────────
# Reference-slice conditioning: slot 0 is the target-phase reference slice. The model always
# marks slot 0 with the camera_token anchor; this is the dataset half.
reference_slot: true
# One-frame-per-slice (the sparse-acquisition extreme this project targets): S is forced per
# subject to the in-FOV plane count, so every in-bbox z plane appears EXACTLY once. The bbox
# spans the whole stack ⇒ S == D (5-21 per subject). Set false for the fixed-S multi-frame
# sampler (full coverage + random extras up to the num_slices budget).
one_frame_per_slice: true
# Train steps per epoch; each epoch visits each subject exactly once in a seeded permutation.
# Keep it equal to the train-split size: LOWER truncates the pass (a seed-dependent subset
# each epoch); HIGHER is harmless but pointless — the epoch ends at the split size.
limit_train_batches: 628
# Val steps per epoch. IGNORED under ef_val_sweep (the default): the trainer then runs exactly
# len(val_targets) = 90 val subjects x {ED, ES} = 180 entries. Only applies with
# ef_val_sweep=false.
limit_val_batches: 180
max_epochs: 300
val_epoch_freq: 1
# Target-phase control. null = uniform sampling per call (multi-phase). Set to an int (e.g. 0)
# to force every sample to use that phase as the target — 0 reproduces the ED-only pipeline.
t_target_fixed: null
# EF-aware validation. `ef_val_sweep` replaces the coupled val sampler with a targeted
# {ED, ES} sweep (each subject reconstructed at its GT ED + ES phase from cardiac_phase.csv),
# so per-phase panels are honest AND we get the ED/ES volumes EF needs.
ef_val_sweep: true
# ED/ES table for the sweep. Must be set explicitly: MRIDataset's fallback
# `${data_root}/../../whs/cardiac_phase.csv` is wrong for the shared-parent data_root.
cardiac_phase_csv: "/home/minsukc/vggt/scratch/data/whs/cardiac_phase.csv"
# Phase-0 nonzero-FOV percentiles used to normalize every phase to [0, 1]. Changing these
# changes model inputs, targets, metrics, cache contents, and checkpoint comparability.
intensity_percentiles: [0.5, 99.9]

# ── Logging ───────────────────────────────────────────────────────────────────────────────
# Every scalar is ALSO mirrored to `${log_dir}/metrics.jsonl`, plus `run_meta.jsonl` and
# `val_per_subject.csv` (docs/60) — analyse a finished run from disk, no wandb needed.
logging:
  log_dir: "./scratch/logs/${exp_name}"
  log_freq: 5
  log_visuals: True
  log_level_primary: DEBUG
  log_visual_frequency:
    train: 628  # once per epoch (matches limit_train_batches = train-split size)
    # (no `val` key: val visuals log at fixed subject indices, not by step — trainer_viz)
  # Nine source/vendor cardiac-cycle GIFs (12 forwards each) are expensive, so log less often.
  filmstrip_every_n_val_epochs: 5
  # Cheaper ED/ES and augmentation panels retain their original cadence.
  visual_panels_every_n_val_epochs: 3
  # Predicted-EF metric (val-only; requires ef_val_sweep). false keeps the ED/ES sweep but
  # skips the segmentation.
  ef_eval_enable: true
  # EF-metric cadence in val epochs. With CorSeg the EF block is cheap relative to the val loop;
  # raise it if using the slower nnunet backend.
  ef_eval_every_n_val_epochs: 1
  # Segmenter for the EF metric: "corseg" (default, docs/57) runs IN `svr`, is faster and more
  # accurate for EF. Valid here ONLY because we feed the full canonical cube; CorSeg collapses
  # on ROI-cropped input. "nnunet" = the Task114 operator that made the GT labels.
  ef_seg_backend: "corseg"
  # Dump per-subject predicted + GT volumes to ${log_dir}/val_volumes/ each val epoch.
  # Overwrites in place (constant ~360 MB disk). Identity affine (canonical voxel space).
  save_val_volumes: true
  wandb_writer:
    _target_: training.train_utils.wandb_writer.WandbLogger
    project: "vggt-mri"
    name: ${exp_name}
    dir: ${logging.log_dir}/wandb
    tags:
      - ${backbone_tag:${backbone}}
      - ${aug_tag:${data.augmentation.enable},${data.augmentation.tier}}
      - ${img_size}
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_volume
        - loss_diffusion
        - loss_gather
        - loss_heart
        # Full-volume metrics (averaged over all D·H·W voxels; D is this subject's own
        # native slice count, so the voxel count VARIES per subject).
        - metric_mae_3d_full
        - metric_mse_3d_full
        - metric_psnr_3d_full
        - metric_ssim_2d_full   # per-slice SSIM (D-independent)
        # Bbox-cropped metrics (only voxels inside the subject's geometric native-FOV region,
        # derived from a content mask propagated through the canonical transforms — NOT an
        # intensity threshold). For small-FOV subjects this excludes the padded zeros that
        # inflate full-volume PSNR. For full-FOV subjects bbox == full.
        - metric_mae_3d_bbox
        - metric_mse_3d_bbox
        - metric_psnr_3d_bbox
        - metric_gt_coverage_frac
        - metric_mean_disp_norm
        - metric_coverage_frac
        - metric_coverage_mean
    val:
      keys_to_log:
        - loss_objective
        - loss_volume
        - loss_diffusion
        - loss_gather
        - loss_heart
        - metric_mae_3d_full
        - metric_mse_3d_full
        - metric_psnr_3d_full
        - metric_ssim_2d_full
        - metric_mae_3d_bbox
        - metric_mse_3d_bbox
        - metric_psnr_3d_bbox
        - metric_gt_coverage_frac
        - metric_mean_disp_norm
        - metric_coverage_frac
        - metric_coverage_mean
        # GT-referenced ship-decision + breathing metrics (val-only; docs/38). Produced by
        # compute_volume_intensity_loss ONLY in val (requires_grad gate), so listing them
        # here (not under train:) is what makes them appear.
        - metric_recov_frac_heart
        - metric_mse_heart_identity
        - metric_mse_heart_model
        - metric_mse_heart_oracle
        - metric_hole_frac_heart
        - metric_psnr_3d_static
        # Anatomy whole-heart-ROI PSNR (seg union+dilation; val-only). Shared ROI with the
        # SVR baselines; complements the intensity-derived motion PSNR.
        - metric_psnr_3d_heartseg
        - metric_mae_3d_heartseg
        - metric_heartseg_frac
        # Same seg ROI, referenced to each subject's OWN identity floor / oracle ceiling
        # (docs/60). `psnr_seg_gain_db` is the headline: raw psnr_heartseg is fine per subject
        # but most of its BETWEEN-subject spread is scan difficulty, not model quality, so only
        # the gain is safe to average over this mixed cohort.
        - metric_psnr_seg_gain_db
        - metric_recov_frac_seg
        - metric_mse_seg_identity
        - metric_mse_seg_model
        - metric_mse_seg_oracle
        - metric_resp_slope_dz
        - metric_resp_corr_dz
        - metric_resp_epe_dz_mm
        - metric_resp_frac_deep_ignored

# ── Checkpointing ─────────────────────────────────────────────────────────────────────────
checkpoint:
  save_dir: "${logging.log_dir}/ckpts"
  save_freq: 50  # a numbered archive every 50 epochs + checkpoint_last each epoch
  resume_checkpoint_path: "./scratch/base_weights/vggt1b_base.pt"
  strict: false
  # Keep the best val epoch's WEIGHTS, so a run that peaks then collapses between save_freq
  # archives does not lose its best weights. Weights-only — a best checkpoint is for
  # evaluating, never for resuming (that is checkpoint_last.pt).
  save_best: true
  # Heart-segmentation ROI PSNR: a real anatomical mask, preferred over the motion-mask
  # metrics for selecting weights. Averaging it ACROSS subjects is usually unsafe (scan
  # difficulty dominates its between-subject spread), but val is deterministic, so every epoch
  # scores the identical subject/phase pairs and that term cancels epoch-vs-epoch.
  # (`metric_psnr_seg_gain_db` — same ROI, referenced to each subject's own identity floor —
  # is the more robust choice if val composition ever stops being fixed.)
  best_metric: metric_psnr_3d_heartseg
  best_metric_higher_is_better: true

# ── Data ──────────────────────────────────────────────────────────────────────────────────
data:
  # `train` / `val` are the MRIDataset kwargs. The trainer wraps each in a plain DataLoader
  # (training/data/loader.py: batch size 1, train reshuffled per epoch, val in order).
  num_workers: ${num_workers}
  train:
    _target_: training.data.MRIDataset
    data_root: ${data_root}
    split: ${split}
    split_file: ${split_file}
    mode: ${mri_data_mode}
    mri_mode: ${mri_mode}
    # Slot BUDGET / cap, not a slot count: `one_frame_per_slice` sets S = this subject's
    # own plane count D (5-21), and mri_dataset raises if D exceeds this.
    # Raise it only alongside the memory it implies.
    num_slices: 20
    target_size: ${img_size}
    patch_size: ${patch_size}
    t_target_fixed: ${t_target_fixed}
    reference_slot: ${reference_slot}
    one_frame_per_slice: ${one_frame_per_slice}
    intensity_percentiles: ${intensity_percentiles}
    # The trainer's gpu_augment_batch re-extracts every input slice on GPU, so building
    # them on the CPU worker first is ~64 MB/sample of pure waste. Only safe because the
    # trainer ALWAYS calls gpu_augment_batch, which treats a missing `images` key as
    # "extract unconditionally". Leave false anywhere else.
    defer_input_images: true
  val:
    _target_: training.data.MRIDataset
    data_root: ${data_root}
    split: "val"
    split_file: ${split_file}
    mode: ${mri_data_mode}
    mri_mode: ${mri_mode}
    num_slices: 20               # slot BUDGET/cap; see the train block above
    target_size: ${img_size}
    patch_size: ${patch_size}
    t_target_fixed: ${t_target_fixed}
    reference_slot: ${reference_slot}
    one_frame_per_slice: ${one_frame_per_slice}
    intensity_percentiles: ${intensity_percentiles}
    # NOT deferred on val (deliberately — see the train block). Scripts across inference/
    # and tools/ build THIS `data.val` node and then read `get_data()["images"]` directly,
    # bypassing gpu_augment_batch; deferring here would break every one of them.
    defer_input_images: false
    ef_val_sweep: ${ef_val_sweep}
    cardiac_phase_csv: ${cardiac_phase_csv}

  # ── GPU augmentation (batchaug) ────────────────────────────────────────────────────────
  # Applied to the (B, T=12, D, H=256, W=256) canonical phases tensor in the trainer between
  # `copy_data_to_device` and forward — one affine per subject, shared across all 12 T-phases
  # so cardiac motion stays consistent. After aug: `gt_target_volume` is re-derived as
  # `phases_aug[b, t_target[b]]`, input slices are re-extracted at the original (t, z) pairs,
  # and `anatomy_bbox` is recomputed from the augmented content mask. Val never affine-augments.
  #
  # `tier` — IN-PLANE ONLY: no through-plane rotation, no elastic, because z is coarse and
  # anisotropic vs the 1.4 mm in-plane grid (each subject keeps its own 5-12 mm pitch). No
  # Gaussian noise (i.i.d. noise is the wrong artifact model; real degradation is structured).
  #   "aggressive"   — flip p=.5; affine p=.9 (rotate ±180°, translate ±32 px, NO per-axis
  #                    scale — replaced by isotropic zoom below); gamma p=.75 (0.6-1.5);
  #                    bias field p=.7 (±0.4). PLUS (docs/63) in-plane
  #                    acquisition-artifact post-ops: isotropic zoom p=.5 (0.8-1.2),
  #                    simulated low-res p=.4 (0.5-0.85), Gibbs ringing p=.3 (alpha
  #                    0.5-0.75), phase-encode ghosting p=.3 (2-5 ghosts, 15-40% line
  #                    attenuation, random H/W axis). All strictly per-slice 2-D;
  #                    D untouched (see _build_ood_post_ops in gpu_aug.py).
  #                    Geometric ops (flip/affine/zoom) warp content_mask AND
  #                    heart_roi_canonical with the same draw (nearest interp).
  #
  # `respiratory`: INDEPENDENT breathing sim (separate toggle from affine). A per-input-slice
  # deform-then-reslice SI+AP shift (Lujan waveform), applied AFTER affine and overwriting ONLY
  # the input slices — target/scanner_coords stay at the end-expiration reference, so the model
  # learns to CORRECT breathing (blind to r). Unlike affine it applies in BOTH train (iid per
  # epoch, private RNG) AND val (deterministic per seq_index), so val measures the real
  # corrupted->clean task.
  augmentation:
    enable: true
    tier: "aggressive"          # the only tier
    respiratory:
      enable: true              # breathing sim on/off (docs/05)
      # SI breath-depth mean/jitter from Burger & Meintjes, "Elliptical Subject-Specific
      # Model of Respiratory Motion for Cardiac MRI," Magn. Reson. Med. 70:722-731 (2013).
      amplitude_mm: 18.8        # mean SI breath depth (mm)
      amplitude_jitter: 7.35    # +/- jitter → ~11.45-26.15mm (tidal → deep)
      cos2n: 3                  # Lujan sin^{2n} exhale-dwell knob
      ap_ratio: 0.35            # AP displacement = ap_ratio * SI
      ap_axis: "H"              # in-plane axis carrying AP ("H" or "W")
      # (`per_slot` deliberately NOT set: it is only read on the non-burst branch, and
      #  group_by_burst below takes the other one.)
      group_by_burst: true      # REALISTIC: all frames of one z-plane share ONE breath PHASE,
                                # independent across planes — a fast per-slice burst sits at ~one
                                # respiratory position, different slices = different breaths.
                                # false → per-slot-iid (lets the splat average breathing
                                # away). docs/01.
      tilt_min_deg: 0.0         # tilt θ ~ U(tilt_min,tilt_max) deg, ONE direction per SUBJECT
      tilt_max_deg: 45.0        # (not per plane); 0-45 covers near-axial to oblique SAX stacks
      amplitude_breath_jitter: 0.0  # per-subject amplitude scale; >0 adds per-breath tidal jitter

# ── Model ─────────────────────────────────────────────────────────────────────────────────
model:
  _target_: vggt.models.vggt.VGGT
  img_size: ${img_size}
  patch_size: ${patch_size}
  backbone: ${backbone}
  # 224 fits on an A40 without activation checkpointing and runs faster. Keep this enabled
  # for higher input resolutions: 518 without checkpointing OOMs, and 294 is near the A40 limit.
  gradient_checkpointing: true

# ── Loss ──────────────────────────────────────────────────────────────────────────────────
loss:
  _target_: training.loss.MultitaskLoss
  volume:
    weight: 1.0
    # grid_shape is not a config param — compute_volume_intensity_loss derives it from
    # batch["gt_target_volume"].shape[1:] (D varies per subject).
    #
    # The splat renders NATIVE 256² slice content (batch["images_splat"], docs/73) — the
    # predicted field is resampled to the native grid in the loss.
    #
    # splat_res — TRAINING-TIME point density of the splat. null = native 256²
    # points per slice. An int R resamples BOTH the field and the native slice to R² before
    # scattering (bilinear, align_corners=True), so R == img_size gives a model-res splat.
    # Does not change the rendered grid. Applies to train AND the in-run val metrics /
    # identity baseline / filmstrip (all splat the same point set); the offline `evaluation/`
    # render reads it from the run's run_meta too. Coverage/hole_frac are NOT comparable
    # between different splat_res settings (different point counts).
    splat_res: 518
    #
    # L2 diffusion (Tikhonov) smoothness ‖∇u‖² on the DVF (VoxelMorph-style). 0.0 ⇒ no-op.
    # DVF is in normalized [-1,1] coords ⇒ gradients are tiny, so a meaningful penalty is
    # O(10-1000). Even at 1000 it is a small fraction of the objective, so it is NOT the
    # binding constraint on contraction amplitude — do not reason about amplitude/EF from its
    # weight. The no-reg ablations (`ablation_{base,nogather,hw2,hw0}.yaml`) set it to 0.0.
    diffusion_weight: 1000.0
    # Coverage-free gather-placement AUXILIARY (docs/38): |sample_volume(V_gt, p) −
    # input_I|, a "pull" term restoring the sharp through-plane placement gradient the splat
    # ÷coverage flattens. Same [0,1] intensity scale as the primary L1 ⇒ a direct ratio.
    gather_weight: 0.5
    # ── heart-ROI L1 (docs/69) ──────────────────────────────────────────────────────────
    # ADDITIVE heart-ROI L1 on top of the full-volume L1 (NOT a mask — masking lets the model
    # paint ghost blobs where V_gt==0; see loss.py).
    # Rationale: the heart is only a few percent of the volume, so most of the full-L1
    # gradient goes to tissue that does not move with the heart.
    # SCALE — read this before changing the number. Both terms are per-voxel MEANS over
    # DIFFERENT voxel counts, so `heart_weight` is NOT a mild relative nudge. A heart voxel's
    # effective per-voxel weight is `1 + heart_weight/heartseg_frac`, and heartseg_frac ~0.05:
    #     w=0.05 -> ~2.0x background, heart ~50% of gradient   (mild)
    #     w=0.10 -> ~3.0x background, heart ~67% of gradient
    #     w=0.25 -> ~6.0x background, heart ~83% of gradient
    #     w=0.50 -> ~11x  background, heart ~91% of gradient   (STRONG — near-masked regime)
    # At 0.5 the background retains only ~9% of the gradient, close to the masked regime.
    # If ghost blobs show up in the V_canon-V_gt panel, drop to ~0.05-0.10 rather than
    # removing the term.
    # get_data drops the ROI key if its on-disk shape != the canonical grid; loss.py then
    # raises rather than silently no-op.
    # ⚠️ Makes metric_psnr_3d_heartseg a training target — judge on amp_ratio / motion PSNR.
    # 0.5 per docs/71.
    heart_weight: 0.5

# ── Optimizer ─────────────────────────────────────────────────────────────────────────────
# AGGREGATOR FINETUNE (aggft) — required for reference-slice conditioning. Reference
# conditioning needs the camera_token (the slot-0 anchor) + z_embedder to specialize, so we
# train the attention blocks + embedders + camera_token and freeze ONLY patch_embed. ~2.8×
# slower than head-only, ~27 GB/A40.
optim:
  frozen_module_names: ["*patch_embed*"]
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05
    # Fused AdamW: one multi-tensor CUDA kernel for the 941M-param update (docs/40).
    fused: True
  amp:
    enabled: true
    amp_dtype: bfloat16
  # Tripwire for the docs/64 failure: a dead ReLU in the DPT head severs the gradient to
  # the aggregator, so the run freezes while grad_point still LOOKS healthy (it is only the
  # final conv's bias). A healthy grad_aggregator sits orders of magnitude above 1e-6, so
  # <=1e-6 sustained for 200 steps does not happen in a live run.
  # Alarms email $VGGT_NOTIFY_EMAIL (default minsukc@umich.edu) ONCE, then training continues.
  grad_collapse_alarm:
    enable: true
    threshold: 1.0e-6
    patience: 200
    modules: ["aggregator"]

  gradient_clip:
    _target_: training.train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["point"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            # Peak LR comes from optim.optimizer.lr — override only that key.
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: ${optim.optimizer.lr}
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: ${optim.optimizer.lr}
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: ${optim.optimizer.weight_decay}

# ── CUDA ──────────────────────────────────────────────────────────────────────────────────
# compile_attention_blocks: compile the 24 frozen DINO + 48 aggregator attention blocks
# individually (docs/40): faster and lighter, with zero graph breaks and ~1 min cold compile.
# Whole-model compilation takes minutes per unseen S; compiling the point head or loss does
# not help.
# NOT bit-identical to eager: compiled BF16 operations reassociate, and fused AdamW
# reorders its update. Set both False for eager numerics.
cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True
  compile_attention_blocks: True
