[project]
authors = [{name = "Minsuk (Eddie) Choi", email = "kusnim1121@gmail.com"}]
dependencies = [
    # numpy 2 as of 2026-07-24 (docs/49). Upper bound 2.5 tracks scipy/numba.
    # Previously capped below 2, which silently downgraded the env on
    # `pip install -e .` and reverted the numpy-2 migration.
    "numpy>=2,<2.5",
    "Pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "opencv-python",
]
name = "vggt"
requires-python = ">= 3.10"
version = "0.0.1"

# Using setuptools as the build backend
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# setuptools configuration
[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*"]
