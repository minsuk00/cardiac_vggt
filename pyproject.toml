[project]
authors = [{name = "Minsuk (Eddie) Choi", email = "kusnim1121@gmail.com"}]
name = "vggt"
requires-python = ">= 3.10"
version = "0.0.1"
# requirements.txt is the single source of truth (pinned torch stack + training deps).
# Install it first, then this package with `pip install --no-deps -e .` so pip never
# re-resolves the torch pins.
dynamic = ["dependencies"]

# Using setuptools as the build backend
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# setuptools configuration. Editable install only: configs, splits and data paths are
# resolved inside the source tree.
[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*", "training*", "inference*"]
exclude = ["*._archive*"]
# Only directories with an __init__.py; the default namespace scan walks into scratch/ (GPFS).
namespaces = false
